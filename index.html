<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARGOS</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="login-page">
        <div class="login-box">
            <h1 id="titulo">Configuração de Acesso</h1>

            <input
                type="text"
                id="username"
                placeholder="Usuário"
            >

            <input
                type="password"
                id="password"
                placeholder="Senha"
            >

            <button onclick="login()">
                Entrar
            </button>
        </div>
    </div>

    <div id="map-page" style="display: none;">
        <h1>Map</h1>
    </div>

    <script src="estrutura.js"></script>

</body>
</html>
